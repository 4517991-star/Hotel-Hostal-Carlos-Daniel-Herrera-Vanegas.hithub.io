<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas | Hotel Lips</title>

    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <header>

        <div class="container">

            <a href="index.html" class="logo">
                Hotel <span>Lips💋</span>
            </a>

            <nav>

                <ul>

                    <li><a href="index.html">Inicio</a></li>

                    <li><a href="habitaciones.html">Habitaciones</a></li>

                    <li><a href="reservas.html" class="active">Reservas</a></li>

                    <li><a href="contacto.html">Contacto</a></li>

                    <li><a href="login.html">Iniciar Sesión</a></li>

                </ul>

            </nav>

        </div>

    </header>

    <main class="booking">

        <div class="container">

            <div class="section-title">

                <h2>Reserva tu Habitación</h2>

                <p>
                    Completa el siguiente formulario y asegura tu estancia
                    en Hotel Lips.
                </p>

            </div>

            <div class="form-container">

                <form action="#" method="post">

                    <div class="form-grid">

                        <div class="input-group">

                            <label for="nombre">Nombre Completo</label>

                            <input
                                type="text"
                                id="nombre"
                                name="nombre"
                                placeholder="Ingrese su nombre"
                                required>

                        </div>

                        <div class="input-group">

                            <label for="correo">Correo Electrónico</label>

                            <input
                                type="email"
                                id="correo"
                                name="correo"
                                placeholder="ejemplo@correo.com"
                                required>

                        </div>

                        <div class="input-group">

                            <label for="telefono">Teléfono</label>

                            <input
                                type="tel"
                                id="telefono"
                                name="telefono"
                                placeholder="0000-0000"
                                required>

                        </div>

                        <div class="input-group">

                            <label for="habitacion">Tipo de Habitación</label>

                            <select
                                id="habitacion"
                                name="habitacion"
                                required>

                                <option value="">Seleccione una opción</option>

                                <option>Habitación Deluxe</option>

                                <option>Habitación Premium</option>

                                <option>Suite Ejecutiva</option>

                                <option>Suite Luna de Miel</option>

                                <option>Habitación Familiar</option>

                                <option>Suite Presidencial</option>

                            </select>

                        </div>

                        <div class="input-group">

                            <label for="entrada">Fecha de Entrada</label>

                            <input
                                type="date"
                                id="entrada"
                                name="entrada"
                                required>

                        </div>

                        <div class="input-group">

                            <label for="salida">Fecha de Salida</label>

                            <input
                                type="date"
                                id="salida"
                                name="salida"
                                required>

                        </div>

                        <div class="input-group">

                            <label for="adultos">Adultos</label>

                            <input
                                type="number"
                                id="adultos"
                                name="adultos"
                                min="1"
                                max="6"
                                value="2"
                                required>

                        </div>

                        <div class="input-group">

                            <label for="ninos">Niños</label>

                            <input
                                type="number"
                                id="ninos"
                                name="ninos"
                                min="0"
                                max="6"
                                value="0">

                        </div>

                        <div class="input-group full-width">

                            <label for="peticiones">
                                Solicitudes Especiales
                            </label>

                            <textarea
                                id="peticiones"
                                name="peticiones"
                                placeholder="Escriba aquí cualquier solicitud especial..."></textarea>

                        </div>

                        <div class="input-group full-width">

                            <button
                                type="submit"
                                class="btn">

                                Confirmar Reserva

                            </button>

                        </div>

                    </div>

                </form>

            </div>

        </div>

    </main>

    <footer>

        <div class="container">

            <p>

                © 2026 Hotel Lips Todos los derechos reservados.

            </p>

        </div>

    </footer>

</body>

</html>
